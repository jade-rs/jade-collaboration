[workspace]
members = [
  "crates/jade-collab-core",
  "crates/jade-collab-sync",
  "crates/jade-docx-collab",
]
# The engine is a submodule with its own workspace; its crates are used as
# path dependencies.
exclude = ["jade-core"]
resolver = "2"

[workspace.package]
edition = "2021"
license-file = "LICENSE"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proptest = "1.6"
thiserror = "2.0"
