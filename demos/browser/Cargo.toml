[workspace]

[package]
name = "jade-collab-browser"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../../LICENSE"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jade-collab-core = { path = "../../crates/jade-collab-core" }
jade-collab-sync = { path = "../../crates/jade-collab-sync" }
jade-docx-collab = { path = "../../crates/jade-docx-collab" }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"

[dev-dependencies]
proptest = "1.6"

[profile.release]
opt-level = "s"
debug = 0

