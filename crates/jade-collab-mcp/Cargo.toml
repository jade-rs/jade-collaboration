[package]
name = "jade-collab-mcp"
description = "MCP server that lets AI agents join jade collaboration sessions as replicas"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "jade-collab-mcp"
path = "src/main.rs"

[dependencies]
jade-collab-core = { path = "../jade-collab-core" }
jade-collab-server = { path = "../jade-collab-server" }
jade-collab-sync = { path = "../jade-collab-sync" }
jade-docx-collab = { path = "../jade-docx-collab" }
jade-xlsx-collab = { path = "../jade-xlsx-collab" }
jade-pptx-collab = { path = "../jade-pptx-collab" }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tempfile = "3"
futures-util = "0.3"
tokio-tungstenite = "0.27"
jade-pptx-reader = { path = "../../jade-core/crates/jade-pptx-reader" }
proptest.workspace = true
tokio = { version = "1", features = ["process"] }
