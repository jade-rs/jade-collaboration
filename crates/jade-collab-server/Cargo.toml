[package]
name = "jade-collab-server"
description = "WebSocket collaboration server and client for jade documents, and the jade-collab CLI"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "jade-collab"
path = "src/main.rs"

[dependencies]
jade-collab-core = { path = "../jade-collab-core" }
jade-collab-sync = { path = "../jade-collab-sync" }
jade-docx-collab = { path = "../jade-docx-collab" }
jade-xlsx-collab = { path = "../jade-xlsx-collab" }
jade-pptx-collab = { path = "../jade-pptx-collab" }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
futures = "0.3"
percent-encoding = "2.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }

tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["process"] }
rcgen = "0.14"
jade-opc = { path = "../../jade-core/crates/jade-opc" }
proptest.workspace = true
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
